name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests (backends / helper whitelist / CLI)
        run: python -m unittest discover -s tests -v
      - name: CLI doctor (real apt backend on runner)
        run: |
          python -m pkgpurge doctor
          python -m pkgpurge list --limit 3 --json
      - name: Build .deb
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fakeroot >/dev/null
          bash packaging/build-deb.sh
      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkgpurge-deb-${{ matrix.os }}
          path: dist/*.deb
